<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시물 좋아요</title>
    <script>
        async function likePost(postId, userId) {
            const response = await fetch(`/posts/${postId}/like?userId=${userId}`, {
                method: 'POST'
            });

            if (response.ok) {
                const message = await response.text();
                alert(message);
                updateLikeCount(postId);
            } else {
                const errorMessage = await response.text();
                alert(errorMessage);  // Show appropriate message if like was not successful
            }
        }

        async function updateLikeCount(postId) {
            const response = await fetch(`/posts/${postId}/likes`);
            const likesCount = await response.json();
            document.getElementById('likeCount').innerText = `좋아요: ${likesCount}`;
        }
    </script>
</head>
<body>
<h1>게시물 제목</h1>
<button onclick="likePost(1, 123)">좋아요</button> <!-- Replace 1 with post ID and 123 with user ID -->
<p id="likeCount">좋아요: 0</p>

<script>
    // Initialize the like count when the page loads
    updateLikeCount(1); // Replace 1 with the actual post ID
</script>
</body>
</html>
