app:
  server-config:
    url: http://localhost:3964
  server-eureka:
    url: http://localhost:3743/eureka/
  cookie:
    domain: "n1.junyeong.dev"
#    domain: "localhost"
server:
  port: 7234

spring:
  application:
    name: service-user
  config:
    import: optional:configserver:${app.server-config.url}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
            
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${app.server-eureka.url}

#logging:
#  config: classpath:log4j2/log4j2-${spring.profiles.active}.properties
logging:
  level:
    root: INFO
    com.team13.serviceuser.service.SignInService: DEBUG # SignInService 클래스의 로그 레벨 설정
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n" # 로그 출력 포맷



